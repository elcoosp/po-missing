[package]
name = "po-missing"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Extract missing translations from PO files and merge completed ones back"
license = "MIT"
repository = "https://github.com/elcoosp/po-missing"
readme = "README.md"
keywords = ["i18n", "gettext", "po", "translation", "cli"]
categories = ["command-line-utilities", "internationalization", "localization"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
rspolib = "0.1.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
