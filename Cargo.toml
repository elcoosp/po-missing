[package]
name = "po-missing"
version = "0.1.0"
edition = "2024"
description = "Extract missing translations from PO files & AI translate then merge-back"
license = "MIT"
repository = "https://github.com/yourusername/po-missing"
readme = "README.md"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rspolib = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["blocking", "json"] }
ollama-rs = "0.3"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
url = "2.4"
